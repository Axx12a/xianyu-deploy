# Nginx配置 - 闲鱼自动回复系统前端
server {
    listen 80;
    server_name localhost;
    
    # 根目录
    root /usr/share/nginx/html;
    index index.html;
    
    # Gzip压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml;
    gzip_comp_level 6;
    
    # 前端静态资源缓存（构建产物hash文件名）
    location /assets {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 首页永不缓存。
    #
    # 本地修复：原配置对 index.html 没有显式缓存策略，浏览器会按启发式规则
    # 缓存它。这样一旦改了前端（比如新增了 /lognotify.js 这行脚本标签），
    # 用户按 F5 仍然在跑缓存的旧页面，表现为"改了没反应、弹窗不出现"。
    # 构建产物是 hash 文件名，靠上面 /assets 那条规则缓存就够了，
    # 所以这里对 HTML 一律禁用缓存。
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires -1;
    }
    
    # API代理到后端服务
    location /api {
        client_max_body_size 50m;
        proxy_pass http://backend-web:8089;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400s;
        proxy_connect_timeout 75s;
    }
    
    # 后端健康检查代理
    location /health {
        proxy_pass http://backend-web:8089/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    
    # 后端静态文件代理（上传的图片、群二维码等，覆盖整个 /static）
    location /static {
        proxy_pass http://backend-web:8089/static;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    
    # SPA路由支持
    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri $uri/ /index.html;
    }
    
    # 错误页面
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
